<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#9c9ca0"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Diagonal light flares -->
  <g transform="rotate(-25 600 315)">
    <rect x="-200" y="80" width="1600" height="3" fill="url(#flare)" opacity="0.55"/>
    <rect x="-200" y="500" width="1600" height="2" fill="url(#flare)" opacity="0.4"/>
  </g>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="180" cy="120" r="1.5" opacity="0.5"/>
    <circle cx="950" cy="200" r="1.8" opacity="0.45"/>
    <circle cx="350" cy="500" r="1.3" opacity="0.4"/>
    <circle cx="1050" cy="450" r="1.6" opacity="0.5"/>
    <circle cx="600" cy="80" r="1.2" opacity="0.35"/>
  </g>

  <!-- Logo mark (S in box) -->
  <g transform="translate(80 80)">
    <rect width="56" height="56" rx="12" fill="#000" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="28" y="42" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="800" font-size="38" fill="#fff">s</text>
  </g>
  <text x="160" y="118" font-family="Manrope,sans-serif" font-weight="600" font-size="24" fill="#fff">Spida<tspan font-family="Fraunces,serif" font-style="italic" font-weight="500" fill="#cfcfd2">Visuals</tspan></text>

  <!-- Eyebrow tag -->
  <rect x="80" y="240" width="290" height="36" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <text x="100" y="263" font-family="JetBrains Mono,monospace" font-size="12" letter-spacing="3" fill="#9c9ca0">VIDEO · MOTION · STUDIO</text>

  <!-- Main title -->
  <text x="80" y="360" font-family="Fraunces,serif" font-weight="500" font-size="76" fill="#ffffff" letter-spacing="-2">Visuele content die je merk</text>
  <text x="80" y="445" font-family="Fraunces,serif" font-weight="500" font-size="76" fill="#ffffff" letter-spacing="-2">laat <tspan font-family="Fraunces,serif" font-style="italic" font-weight="400" fill="url(#chrome)">opvallen.</tspan></text>

  <!-- Sub -->
  <text x="80" y="510" font-family="Manrope,sans-serif" font-size="22" fill="#b8b8bc">Een Nederlandse video- en motion studio · spidavisuals.nl</text>

  <!-- Bottom bar -->
  <line x1="80" y1="555" x2="1120" y2="555" stroke="rgba(255,255,255,0.1)"/>
  <text x="80" y="592" font-family="JetBrains Mono,monospace" font-size="13" letter-spacing="2" fill="#727275">TIKTOK · REELS · BRAND FILMS · MOTION</text>
  <text x="1120" y="592" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="13" letter-spacing="2" fill="#727275">SPIDAVISUALS.NL</text>
</svg>
